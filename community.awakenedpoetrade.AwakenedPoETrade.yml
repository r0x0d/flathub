id: community.awakenedpoetrade.AwakenedPoETrade
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: awakened-poe-trade
rename-icon: awakened-poe-trade
rename-desktop-file: awakened-poe-trade.desktop
license: MIT
homepage: https://github.com/SnosMe/awakened-poe-trade
description: |
  Awakened PoE Trade is an advanced trading tool for Path of Exile, providing price checks, item info, and more.
finish-args:
  - --share=network
  - --device=dri
  - --filesystem=home
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.freedesktop.Notifications
  - --socket=system-bus
  - --socket=session-bus
  - --system-talk-name=org.freedesktop.Flatpak
  - --env=ELECTRON_TRASH=gio

categories:
  - Utility
  - Game

modules:
  - name: awakened-poe-trade
    buildsystem: simple
    build-commands:
      # Extract AppImage
      - chmod +x awakened-poe-trade.AppImage
      - ./awakened-poe-trade.AppImage --appimage-extract
      - rm awakened-poe-trade.AppImage

      # Fix desktop files
      - install -Dm755 awakened-poe-trade /app/bin/awakened-poe-trade
      - sed -i 's|^Exec=.*|Exec=/app/bin/awakened-poe-trade|g' squashfs-root/awakened-poe-trade.desktop 
      - sed -i 's|^Icon=.*|Icon=community.awakenedpoetrade.AwakenedPoETrade|g' squashfs-root/awakened-poe-trade.desktop 
      - install -Dm644 squashfs-root/awakened-poe-trade.desktop -t /app/share/applications

      # Install hicolors images
      - install -dm755 /app/share/applications
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/512x512/apps/awakened-poe-trade.png -t /app/share/icons/hicolor/512x512/apps
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/256x256/apps/awakened-poe-trade.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/128x128/apps/awakened-poe-trade.png -t /app/share/icons/hicolor/128x128/apps
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/64x64/apps/awakened-poe-trade.png -t /app/share/icons/hicolor/64x64/apps
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/48x48/apps/awakened-poe-trade.png -t /app/share/icons/hicolor/48x48/apps
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/32x32/apps/awakened-poe-trade.png -t /app/share/icons/hicolor/32x32/apps
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/24x24/apps/awakened-poe-trade.png -t /app/share/icons/hicolor/24x24/apps
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/16x16/apps/awakened-poe-trade.png -t /app/share/icons/hicolor/16x16/apps

      - rm -f squashfs-root/{.DirIcon,AppRun,awakened-poe-trade.desktop.awakened-poe-trade.png.png}

      - mv squashfs-root /app/main/
      - patch-desktop-filename /app/main/resources/app.asar
    sources:
      - type: file
        dest-filename: awakened-poe-trade.AppImage
        only-arches:
          - x86_64
        url: https://github.com/SnosMe/awakened-poe-trade/releases/download/v3.26.101/Awakened-PoE-Trade-3.26.101.AppImage
        sha256: 9fbc707801cd61048340cc59a4711feb43d993adb277032c5bd6bb93741e5351

      - type: script
        dest-filename: awakened-poe-trade
        commands:
          - exec zypak-wrapper.sh /app/main/awakened-poe-trade "$@"
